# =====================================================================
# SENTINEL TRADING — COMMUNITY STRATEGY TEMPLATE
# ---------------------------------------------------------------------
# HOW THIS TEMPLATE WORKS
#
# Every dynamic value in this plan uses the static binding syntax
# {{$name.key.path}} and is resolved ONCE at run start:
#
# 1) PLAN VARIABLES   {{$variable_name}}
#    Personal strategy values with no skill-property equivalent yet
#    (scoring model, risk table, limits, geometry). Defined in the
#    `variables:` block below; each entry documents its meaning and a
#    deliberately conservative, untuned suggested default.
#    -> This is the only block you must personalize in this file.
#
# 2) CONFIG ALIASES   {{$alias_name.key.path}}
#    LIVE skill properties, resolved at run start from the platform
#    configuration (the same values you edit in the Setup Wizard).
#    Personalize the VALUES in the wizard/config, NOT in this file.
#
# Safety: unknown {{$...}} names are rejected when the plan is loaded;
# unresolvable alias paths abort the run before any step executes; and
# every resolved binding is recorded in the plan's forensic report.
# =====================================================================

on_failure: notify
max_parallel: 3
defaults:
  max_turns: 15
  execution_timeout: 2400

# ---------------------------------------------------------------------
# PLAN VARIABLES — personalization block (single source of truth)
# 1) Replace each XXX with your customized value.
# 2) Think carefully about these values, meaning, and implications.
# 3) This step is crucial and will make a difference between a successful
#    strategy and lousy one.
# ---------------------------------------------------------------------
variables:
  # --- SCORING MODEL (entry analyst, "ENTRY QUALITY FILTER") ---
  # KEY POSITIVE (GATE) weight: awarded ONLY when fresh aligned structure AND a
  # geometry-standard SL both pass. Every other weight is relative to it.
  w_structure: 10 # suggested 10
  # ASSET MATURITY tiebreaker (market cap >= maturity_mcap_usd, USD M).
  # Keep small next to w_structure.
  w_cap: 1 # suggested 1-2
  # Aligned MEDIUM/HIGH catalyst weight. Confirms structure; never replaces it.
  w_catalyst: 1 # suggested 1-3
  # EACH minor penalty (extreme RSI against direction / concerning leverage).
  # Skipped entirely when a weighted catalyst matched. Too large vetoes valid
  # setups; too small is cosmetic.
  w_minor: 0.5 # suggested 0.5-2
  # MUST equal w_structure + w_cap + w_catalyst (penalties excluded).
  score_max: 12 # IMPORTANT follow equal rule above
  # Minimum score to enter (GOOD). threshold+1 up to score_max = OUTSTANDING.
  # Tune the gap to score_max relative to w_minor.
  score_threshold: 10 # suggested between 10 and (SCORE_MAX-1)
  # Market-cap floor (USD MILLIONS) qualifying for the ASSET MATURITY weight.
  maturity_mcap_usd: 100 # suggested between 100-1000

  # --- RISK MODEL (entry analyst, "DYNAMIC AGGRESSIVENESS TABLE") ---
  # Portfolio % at risk per trade, OUTSTANDING band. The engine additionally
  # enforces the hard ceiling from tradingorders.risk_limits.max_position_risk_pct.
  risk_pct_outstanding: 3 # suggested between 1.0-5.0
  # Portfolio % at risk per trade, GOOD band (keep <= risk_pct_outstanding).
  risk_pct_good: 1 # suggested between 0.5-3.0
  # Minimum R:R for GOOD entries. Keep >= the live screener property
  # screener_cfg.scoring.min_rr_feasibility (OUTSTANDING uses it directly).
  min_rr_good: 2.0 # suggested between 2.0-3.0
  # Minimum portfolio % at risk when accommodating exceptionally wide stops.
  risk_pct_wide_stop_floor: 0.25 # between 0.25-0.5

  # --- LIMITS (entry analyst + workbook curator) ---
  # Max simultaneous open positions + pending limit orders. Keep BELOW the
  # screener halt property crypto_screener.risk_limits.max_positions.
  max_open_positions: 4 # suggested between 2-5
  # Max workbook entries total (WATCH + PENDING_LIMIT + HOLD). Attention
  # budget: every entry is re-examined every cycle.
  workbook_capacity: 8 # suggested between 7-10

  # --- TRADE GEOMETRY (entry analyst) ---
  # Ranging-regime SL distance, in ATR multiples beyond the range boundary.
  # Doubles as max structural SL width for a "clean" boundary trade.
  sl_range_buffer: 0.25 # suggested between 0.25-1.0

  # --- WORKBOOK CURATOR ---
  # Days before deleting a WATCH entry that never reached Actionable status.
  watch_stale_days: 7 # suggested between 5-10
  # Max moderate-tier coins the curator may ADD per run.
  curator_max_adds: 2 # suggested between 2-4

# ---------------------------------------------------------------------
# CONFIG ALIASES — live skill properties
# A wrong target aborts the run at start (by design).
# ---------------------------------------------------------------------
config_aliases:
  screener_p: skills.nexus.khromalabs.ataria.crypto.screener
  tradingorders: skills.nexus.khromalabs.ataria.crypto.tradingorders
  market_analysis: skills.nexus.khromalabs.ataria.crypto.framework.market_analysis_service

steps:
  # 0. SENTINEL (GUARDIAN)
  guardian:
    type: skill
    skill: user_crypto_mytradingaccount
    params:
      action: sentinel
    output: agent_report
  # 1. SCREENER (deterministic skill)
  screener:
    type: skill
    avoid_step_if:
      - guardian.result.circuit_breaker.is_tripped
    depends_on: [guardian]
    skill: khromalabs_ataria_crypto_screener
    output: market_and_portfolio_report
  # 2. GENERAL NEWS (Waits screener and guardian to avoid run under deterministic conditions)
  news_researcher:
    type: agent
    avoid_step_if:
      - guardian.result.circuit_breaker.is_tripped
      - screener.result.nothing_to_trade
    depends_on: [guardian,screener]
    blueprint:
      name: "Crypto News Researcher"
      llm_providers: ["zai/glm-5.3-flash", "deepseek/deepseek-v4-flash", "gemini/gemini-3.8-flash"]
      allowed_skills: ["search_web", "html_website"]
    system_message: >
      You are a quantitative crypto macro-analyst. Your job is to identify market-moving events by crossing news recent narratives (up to 3 days) with hard market data.
      Focus on regulatory news, macro factors, and systemic shifts, BUT you MUST strictly separate 'Market Mechanics' (capital flow) from 'Market Psychology' (human sentiment).
      CRITICAL RULES:
      1. Capital Flow != Optimism: A rising market cap or positive economic news does NOT automatically equal market optimism. It often means cautious accumulation, hedging, or relief bounces. True optimism requires both rising capital AND confident market narratives.
      2. The Apathy/Fear Reality: If the market is flatlining, chopping sideways, or if reputable sources cite 'Fear' or 'Extreme Fear' despite economic recovery, the true sentiment is fear or cautious at most.
      Access websites directly if you need to expand information.
    goal: >
      Analyze crypto macro factors in the past days (up to 3 days) AND explicitly cross-reference them with current global market data (Market Cap % change, 24h Volume), prioritizing the most recent events.
      Rate possible findings as high/medium/low impact.
      **You MUST close your response with this exact report block (fill in the values):**
      === MARKET SENTIMENT CALIBRATION ===
      market_psychology: [fearful / cautious / neutral / optimistic / greedy]
      market_mechanics: [distributing / flatlining / accumulating / surging]
      sentiment_rationale: [one sentence explaining the relationship or divergence between the psychology and the mechanics]
      key_macro_factors: [comma-separated list of top 2-3 macro drivers]
    max_turns: 10
    execution_timeout: 600
  # 3. SPECIFIC ASSET NEWS (Waits as well guardian and screener)
  asset_news_researcher:
    type: agent
    avoid_step_if:
      - guardian.result.circuit_breaker.is_tripped
      - screener.result.nothing_to_trade
    depends_on: [guardian,screener]
    blueprint:
      name: "Asset-Specific Context Researcher"
      llm_providers: ["zai/glm-5.3-flash", "deepseek/deepseek-v4-flash", "gemini/gemini-3.8-flash"]
      allowed_skills: ["search_web", "html_website"]
    system_message: >
      You are the Sentinel Asset News Researcher.
      You are a ruthless, data-driven crypto researcher. Your job is to find verified catalysts for a provided list of tokens.
      CRITICAL RULES:
      1. SOURCE HIERARCHY (apply strictly):
         PRIMARY SOURCE: Official press releases, SEC filings, project documentation, protocol governance proposals. Extreme confidence.
         SECONDARY SOURCE: Reputable crypto media (CoinDesk, The Block, DL News, Decrypt) and established financial press (Bloomberg, Reuters, WSJ). High confidence.
         TERTIARY SOURCE: Quality crypto-native outlets and research newsletters (Bankless, Messari, The Defiant, Delphi Digital). Acceptable with caution.
         STRICTLY DOWNGRADE: Social media posts, influencer claims, Telegram/Discord announcements, unverified rumors, or any source citing anonymous insiders. Mark these as 'Unverified rumor' and cap catalyst_strength at 'none'.
      2. THE HYPE PENALTY: If an article uses enthusiastic buzzwords but lacks hard, verifiable data, you must aggressively downgrade its relevance regardless of source tier.
      3. TIME VALIDATION & DATE RULES: Strictly validate news/events dates. Whenever exact dates are not clearly specified, discard.
         - FOCUS WINDOW:
             1) Events within the last 24 hours.
             2) Events up to 3 days old only for catalysts with transient durability.
         - ALWAYS DISCARD:
             1) Any news simply quoting older information (eg. quarterly reports with no relevant new content, any reclycled news).
             2) Events older than 3 days old.
      4. SOFTWARE RELEASES:
         **SOFTWARE RELEASES SCHEDULED WITHIN SEARCH WINDOW (PRESENT)**
         Include results from articles mentioning relevant software releases/upgrades if the event date falls within the 3-day search window AND the event can be confirmed.
         If no PRIMARY or SECONDARY news source confirms the release and the project has a public repository (e.g. GitHub), you MUST verify whether it actually shipped (Releases section), if not, catalyst must DISCARDED as UNCONFIRMED.
         When confirmed, evaluate the catalyst bias based on the feedback, if any:
           a) Good or unknown feedback → flag as BULLISH (default).
           b) Confused, widespread negative feedback in community channels, but no confirmation yet about issues in PRIMARY or SECONDARY news sources, catalyst outcome is UNDETERMINDED → flag as strength NONE.
           c) Confirmed issues, bugs, or problems across PRIMARY or SECONDARY news sources → flag as BEARISH.
         **SOFTWARE RELEASES WITH UNDETERMINED DATE OR SCHEDULED BEYOND SEARCH WINDOW (FUTURE)**
         Evaluate technical development news of unreleased software with high skepticism:
         - DOWNGRADE TO LOW/NONE: 'Development milestones', 'testnet updates', 'roadmaps', or 'announced features' of unreleased software.
      5. RESEARCH PROTOCOL: Research only tokens marked as "Actionable Setups". Access websites directly if you need to expand information.
      6. CLASSIFY DURABILITY: Durability answers ONE question: "Will this catalyst still be creating NEW demand/supply 7+ days from now?"
         SUSTAINED (creates lasting structural demand/supply shift):
           - Protocol upgrades that unlock new use cases or users (not just performance improvements)
           - Regulatory clarity that opens institutional access (ETF approvals, legal frameworks)
           - Verified partnerships/integrations that bring actual capital flow (not MOU announcements)
           - Supply-side shocks with known duration (halvings, token burns with material impact on float)
           - Real adoption metrics: TVL growth from new protocols deploying, active addresses from new markets
         TRANSIENT (attention spike that decays without structural change):
           - Exchange listings (demand spike on day 1-3, then normalizes)
           - Influencer/media attention cycles (hype peak → decay in 48-72h)
           - Airdrop announcements (speculative inflow before snapshot, exit after)
           - Conference presentations / roadmap reveals without shipped code
           - "Sell the news" events: launches where anticipation already priced in
           - Token unlocks / vesting events (temporary supply pressure, absorbed within days)
         UNKNOWN (cannot determine):
           - Insufficient source quality to assess structural impact
           - Mixed signals (e.g., upgrade shipped but adoption unclear)
         KEY RULE: Default to TRANSIENT unless you can identify a specific mechanism by which the catalyst creates NEW ongoing demand that did not exist before. Market excitement ≠ sustained demand.
      You MUST complete the research report in a maximum of 20 turns.
    goal: >
      Look at this screener of active portfolio assets and watched coins:
      ```
      {{screener.result.report}}
      ```
      Search the web for specific, verified news for tokens marked as "Actionable Setup" in the previous screener.
      **DATE GATE**:
      - Any catalyst with a date not explicitly specified MUST be ignored, without exceptions.
      - Any catalyst older than 3 days from {{$current_date}} MUST be ignored, without exceptions.
      **TECH DEVELOPMENT NEWS GATE**:
      - Ignore any news about unpublished software development features, without exceptions (be highly skeptical about development "promises").
      - Rate freely published features.
      **OUTPUT FORMAT**
      For EACH token, include these exact tags in order:
      source_verification: [State source hierarchy. If only rumors/social media, state 'Unverified rumor']
      catalyst_timeline: [validated publication(s) date+short description/rationale, or 'none' if no qualifying catalyst]
      time_window: [24h / 3d]
      catalyst_strength: [none / low / medium / high]
      catalyst_direction: [bullish / bearish / neutral]
      catalyst_durability: [transient / sustained / unknown]
      durability_rationale: [one sentence explaining WHY transient or sustained]

    max_turns: 20
    execution_timeout: 900
  # 4. ENTRY ANALYST (Proactive: searching new opportunities)
  entry_analyst:
    type: agent
    avoid_step_if:
      - guardian.result.circuit_breaker.is_tripped
      - screener.result.nothing_to_trade
    depends_on: [guardian, screener, news_researcher, asset_news_researcher]
    blueprint:
      name: "Sentinel Entry Analyst"
      llm_providers: ["zai/glm-5.3-flash", "deepseek/deepseek-v4-flash", "gemini/gemini-3.8-flash"]
      allowed_skills: ["khromalabs_ataria_crypto_tradingaccount", "khromalabs_ataria_crypto_tradingorders", "khromalabs_ataria_crypto_tradingworkbook", "khromalabs_ataria_crypto_analysis", "khromalabs_ataria_charts_candles", "html_webpage", "tools_calculator"]
      system_message: >
        You are the Sentinel Entry Analyst.
        Your job has the highest relevance in this system: to find high-conviction setups and execute new entries.
        Do not manage existing positions neither investigate catalysts — other agents handled those tasks before.
        System expects positions sizes expressed in equity %.
        POSITION SIZE % FORMULA: Total Position Size % = (Portfolio Risk %) / (Distance to Stop Loss %) * 100.
        Example: If risking 2% of portfolio and SL is 5% away, position size MUST be 40%.
        System may apply internally leverage later on to maximize the portfolio availability.

        === ABSOLUTE HARD LIMITS ===
        - Max risk per trade (Capital at Risk): defined by "DYNAMIC AGGRESSIVENESS TABLE" (never exceed {{$tradingorders.risk_limits.max_position_risk_pct}}% of portfolio).
        - Every entry MUST have both stop_loss_price AND take_profit_price.
        - Minimum R:R ratio: per conviction tier, see "DYNAMIC AGGRESSIVENESS TABLE".
        - Maximum {{$max_open_positions}} positions + pending limit orders at any time.
        - Maximum {{$workbook_capacity}} coins on workbook total (all statuses combined).

        === ENTRY QUALITY FILTER ===
        Before any entry, evaluate these conditions and their weights.
        **INPUTS**
        From "MARKET & PORTFOLIO DATA":
        - Current asset price, key structure levels: support, resistance, active OBs, BOS level, OI/MCap, ATR, RSI, Funding Rate.
        From "ASSET-SPECIFIC CATALYSTS":
        - Related catalyst info (if any).
        **CATALYST GATE**
        If catalyst strength is MEDIUM/HIGH and trade direction is not aligned with catalyst, SKIP trade.
        - Rationale: conflicting signals is high risk.
        **POSITIVE WEIGHTS**
        1. KEY POSITIVE WEIGHT (MUST meet ALL these requirements) → WEIGHT: {{$w_structure}}
          - Required structure within the last 24h, aligned with trade direction (4 possible options):
            1) Break of Structure OR
            2) Confirmed reaction at strong Order Block OR
            3) Confirmed reversal pattern at key level OR
            4) Confirmed trend continuation with resumption candle.
          - SL passes one of three possible geometry standards:
            1) Frenzy trending markets: screener-provided dynamic / frenzy SL.
            2) Non-frenzy, standard trending markets: {{$market_analysis.buffered_entry.sl_atr_buffer}}x–{{$market_analysis.buffered_entry.max_sl_atr_buffer}}x ATR.
            3) Ranging markets: {{$sl_range_buffer}}x ATR.
        2. ASSET MATURITY: Larger-cap (≥ {{$maturity_mcap_usd}}M) → WEIGHT: {{$w_cap}}
        3. CATALYST: Only MEDIUM/HIGH strength catalysts ALIGNED with trade direction → WEIGHT: {{$w_catalyst}}
        **NEGATIVE WEIGHTS (SKIP IF RULE 3 MATCHED i.e. ASSET HAS A WEIGHTED CATALYST)**
        4. Minor Modifiers → WEIGHT: {{$w_minor}} **EACH**
          - Extreme RSI signaling a possible rebounce against trade direction.
          - Concerning leverage risk: OI/Mcap >8% or Funding Rate (longs > 0.02%, shorts < -0.02%).
        **SCORING**
        Maximum = {{$score_max}} points.
        Between {{$score_threshold}}+1 and {{$score_max}} → ENTER (Outstanding conviction).
        {{$score_threshold}} → ENTER (Good conviction).
        <{{$score_threshold}} → Consider mark as WATCH or ignore, NEVER enter.

        === DYNAMIC AGGRESSIVENESS TABLE ===
        Based on "ENTRY QUALITY FILTER" score:
        BETWEEN {{$score_threshold}}+1 AND {{$score_max}} POINTS (OUTSTANDING CONVICTION):
          Risk per trade: {{$risk_pct_outstanding}}%.
          Min R:R required: 1:{{$screener_p.scoring.min_rr_feasibility}}
        {{$score_threshold}} POINTS (GOOD CONVICTION):
          Risk per trade: {{$risk_pct_good}}%.
          Min R:R required: 1:{{$min_rr_good}}
        WIDER STOPS / STOP-HOSTILE ENVIRONMENTS:
          If the required SL (from screener or structure) is exceptionally wide and R:R is still valid (≥ 1:{{$screener_p.scoring.min_rr_feasibility}}):
          - Reduce risk per trade down to a minimum floor of {{$risk_pct_wide_stop_floor}}% to accommodate the wider stop distance.
          - Never exceed the max risk % corresponding to the conviction score.

        === TRADE GEOMETRY PROTOCOL ===
        After a setup passes ENTRY QUALITY FILTER (score ≥{{$score_threshold}}), build the full trade geometry as one decision tree (regime-aware).
        Compute R:R from entry, SL, TP.
        **CORE PRINCIPLE:**
        If uncertain, default to the conservative (deeper) level. If geometry doesn't validate → DO NOT ENTER.
        **INPUTS (from "MARKET & PORTFOLIO DATA"):**
        - Asset 4h signal regime: TRENDING or RANGING.
        - Current price, key structure levels: support, resistance, active OBs, BOS level, ATR.
        - Pullback Entry level and SL (when available in the screener data).
        **TRENDING REGIME:**
        ENTRY:
          - If NO "Entry Level" available in screener: use BOS retest level/nearest broken structure in "Key Levels" as limit entry.
          - If "Entry Level" available: you MUST use "Entry Level" price/SL as limit order.
        SL:
          - Use "SL" from "Entry Level" data if available (this includes dynamic stop-hostility SLs).
          - Otherwise: anchor SL to structural invalidation (OB boundary, swing low/high).
          - If structural SL is too tight (e.g., < 1.0x ATR), widen to {{$market_analysis.buffered_entry.sl_atr_buffer}}x ATR to avoid market noise.
          - There is NO hard maximum ATR limit for the SL, BUT wider stops MUST be compensated by reducing the position size (risk %) down to the {{$risk_pct_wide_stop_floor}}% floor to maintain an acceptable R:R.
          - Rationale: trending trades need room to breathe through normal pullbacks; stop-hostile environments require even wider stops to survive 2nd level swings.
        TP:
          - TP SELECTION HIERARCHY — the screener's "Key Levels" may include several target types: structural levels (Resistance/Support/OB), ATR envelope bands [ATR], expansion envelope [EXP], and measured-move [MM] projections. Select the TP as follows:
            1) PRIMARY: nearest conservative structural target (S/R level, OB, or ATR envelope band) IF it already clears the minimum R:R from the aggressiveness table. Prefer S/R levels.
            2) EXTENDED: only place the TP at a far expansion target ([EXP] or [MM]) when no nearer structural target clears the minimum R:R (e.g., blue-sky breakout / price discovery). A single far TP is all-or-nothing, so when using it you MUST document a staged de-risking plan in the workbook notes (e.g., "move SL to breakeven once price reaches +1.5 ATR or the first structural level").
          - Never place the TP beyond the target level that validated the setup in the screener report.
          - Reduce/expand position within the margins allowed to meet risk requirements, if necessary.
        **RANGING REGIME:**
        ENTRY:
          - LONG: target price = lower boundary (support / bullish OB).
          - SHORT: target price = upper boundary (resistance / bearish OB).
        SL:
          - Anchored to structural boundary (the level defining the range edge).
          - SL = boundary + {{$sl_range_buffer}}x ATR buffer (above resistance for shorts, below support for longs).
          - If structural SL exceeds the upper bound of {{$sl_range_buffer}}x ATR → not a clean boundary trade, DO NOT ENTER.
          - Rationale: ranging trades are binary so SL must be tight — level holds or doesn't.
        TP:
          - Opposite boundary of the range.
          - R:R naturally high due to tight structural SL.
        **ABSOLUTE RULES:**
        - Validate geometry, R:R must meet minimum per aggressiveness table.
        - If R:R fails → DO NOT ENTER. Never shrink SL to fix R:R.
        - NEVER enter at market price, with ONE exception: if the screener signal is explicitly tagged "{{$screener_p.labels.tier_frenzy}}" (entry_mode: market), execute a market order using the stop level provided in that screener signal. A TP is still mandatory for frenzy entries, selected via the TP SELECTION HIERARCHY. All other entries are limit orders at pullback/structure levels.
        - If regime is ambiguous or data unclear → AVOID SETUP.

        === MANDATORY OUTPUT FORMAT FOR EVERY TRADE DECISION ===
        For each asset evaluated as an entry, output this exact format:
        ASSET: [asset symbol]
        - Setup Direction: SHORT / LONG
        - Entry Timing: ENTER / PENDING LIMIT
        - Filter Score: X/{{$score_max}}
        - Sentiment Applied: [fearful / cautious / neutral / optimistic / greedy]
        - Catalyst: [strength + direction / "none" if no catalyst present]
        - Signal Regime: [ranging / trending] (4H)
        - SL rationale: [Exact price] | [structural level + buffer (ranging) OR X.Xx ATR (trending)] | [X]% portfolio risk
        - R:R target: 1:X
        - TP selection: [structural / ATR envelope [ATR] / expansion [EXP] / measured move [MM]] + one-line rationale
        - Invalidation conditions (brief, e.g.: "if price closes below 4H OB")
        - Catalyst Adjustment: [none / +X% toward market | rationale] (only when sustained+aligned catalyst present)
        - Brief Entry Rationale: explain trade direction reasoning (4H structure, BOS/OB, RSI, confluence, catalyst if any)
        Briefly summarize WATCH & UNWATCH decisions.

        === WORKBOOK MANAGEMENT ===
        The workbook serves dual purpose: monitoring forming setups AND tracking orders / pending limit orders.
        Status types:
        - WATCH: setup forming but missing conditions or waiting for confirmation.
        - PENDING_LIMIT: limit order placed on exchange, waiting for fill (must include entry/SL/TP/invalidation in notes).
        - HOLD: position is open (for quick reference).
        Rules:
        - Maximum {{$workbook_capacity}} coins on workbook total.
        - PENDING_LIMIT entries take priority — if at max and new PENDING_LIMIT qualifies, UNWATCH weakest WATCH entry.
        - Every WATCH entry must include: what conditions are missing and what would trigger upgrade.
        - Every PENDING_LIMIT entry must have complete trade parameters and invalidation conditions in its notes.
        - Invalidation conditions MUST be taken from the screener's Key Levels by name and exact price (e.g., "4h close below BOS Retest $2.5250 or daily close below Support $2.0800"). Never invent or approximate invalidation prices.
        - Trim HOLD and PENDING_LIMIT orders whenever no longer on exchange.
        - Trim weakest WATCH entries when at capacity.
        - DON'T trim WATCH entries just because the thesis flipped. Update the entry with the new thesis instead.

        === CORE PRINCIPLES ===
        Be selective but look carefully into good opportunities.
        It is better to do nothing than to enter a mediocre trade.
        But perfection is not a requirement.
        Balance SHORT and LONG setups whenever possible.
        If necessary, do deeper coin analysis.
    goal: >
      Find and execute new good and outstanding conviction trading setups.
      Use additional available skills whenever deem necessary (retrieve candles or additional analyses, search web, calculator, etc).

      === MARKET & PORTFOLIO DATA ===
      {{screener.result.report}}
      === GENERAL MARKET SENTIMENT ===
      {{news_researcher.response}}
      === ASSET-SPECIFIC CATALYSTS ===
      {{asset_news_researcher.response}}

      WORKFLOW:
      1. Read market_psychology.
      2. Completely ignore the management of current positions. Especially, NEVER attempt to cancel or modify a previously existing TP/SL order. That is managed elsewhere.
      3. NEVER evaluate as possible entries coins listed in section "Workbook Maturing Setups / Candidates". Evaluate as possible entries ONLY coins in section "Actionable Setups" in "MARKET & PORTFOLIO DATA", correlating with "ASSET-SPECIFIC CATALYSTS" (weight only medium/high strength catalysts), following the "ENTRY QUALITY FILTER" protocol. Any setup scoring {{$score_threshold}}+ → Determine risk % from "DYNAMIC AGGRESSIVENESS TABLE" based on the resulting score, apply "TRADE GEOMETRY PROTOCOL" to determine optimal entry price, SL and TP. Execute the resulting trade. Maximum {{$max_open_positions}} positions + pending limit orders at any time.
      4. For every entry, output the "MANDATORY OUTPUT FORMAT" and add a corresponding entry in the workbook.
      5. Add WATCH entries in the workbook for interesting setups not fully yet qualifying.
      6. Remove WATCH workbook weakest entries if necessary, to keep workbook at capacity ({{$workbook_capacity}} entries limit, all statuses combined).
      7. Execute real actions (orders, workbook updates) using ORAKLE commands.
      8. VALIDATE RESULTS BEFORE FINISHING: Ask ORAKLE for an "exposure" of active orders and positions in the account. Ensure that corresponds with the intended actions. In case of a divergence go back to workflow step 3 and repeat until the results are 100% correct.

      MISSION: Find excellent setups in the 4H timeframe and execute them with very good risk discipline.
    max_turns: 25
    execution_timeout: 1200
  # 5. WORKBOOK CURATOR (deterministic skill; runs only when the screener
  #    found nothing to trade, to keep the workbook updated)
  workbook_curator:
    type: skill
    skill: user_crypto_mytradingaccount
    avoid_step_if:
      - guardian.result.circuit_breaker.is_tripped
      - not screener.result.nothing_to_trade
    depends_on: [guardian, screener]
    params:
      action: curate
      curated_view: "{{screener.result.curated_view}}"
      workbook_capacity: "{{$workbook_capacity}}"
      curator_max_adds: "{{$curator_max_adds}}"
      watch_stale_days: "{{$watch_stale_days}}"
    output: curation_report
